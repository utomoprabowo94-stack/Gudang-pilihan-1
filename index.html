
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GudangPilihan - Belanja Hemat</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f5f6fa;color:#222}
header{background:#ff6b35;color:white;text-align:center;padding:25px 15px}
header h1{margin:0;font-size:30px}
header p{margin:8px 0 0}
.container{max-width:900px;margin:auto;padding:20px}
.welcome{text-align:center;padding:20px 5px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.product{background:white;border-radius:12px;padding:15px;box-shadow:0 2px 8px #ddd}
.product img{width:100%;height:160px;object-fit:contain;background:#fafafa;border-radius:8px}
.product h3{font-size:18px}
.price{color:#e94e20;font-weight:bold;font-size:19px}
.product a{display:block;text-align:center;background:#ff6b35;color:white;text-decoration:none;padding:12px;border-radius:8px;margin-top:12px}
footer{text-align:center;padding:25px;color:#777}
</style>
</head>
<body>
<header>
<h1>GudangPilihan</h1>
<p>Temukan produk pilihan dengan harga menarik!</p>
</header>
<div class="container">
<div class="welcome">
<h2>Selamat Datang di GudangPilihan</h2>
<p>Rekomendasi produk menarik dari Shopee dan TikTok Shop.</p>
</div>
<div class="products">
<div class="product">
<img src="https://placehold.co/400x300?text=Mama+Lemon" alt="Mama Lemon">
<h3>Sabun Cuci Piring Mama Lemon 5 Liter</h3>
<p class="price">Rp34.939</p>
<a href="https://s.shopee.co.id/AUvPmePJZ8" target="_blank">Beli di Shopee</a>
</div>
</div>
</div>
<footer>
<p>GudangPilihan © 2026</p>
<p>Belanja mudah, pilihan tepat!</p>
</footer>
</body>
</html>
